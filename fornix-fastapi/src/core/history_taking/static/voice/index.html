<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Patient Conversation Recorder</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f4f7f9;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }

        .controls {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #3498db;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            margin: 0 10px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #2980b9;
        }

        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        #status {
            text-align: center;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .wave-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 50px;
            margin-bottom: 20px;
        }

        .wave {
            width: 5px;
            height: 100%;
            background-color: #3498db;
            margin: 0 3px;
            border-radius: 5px;
            animation: wave 1s ease-in-out infinite;
        }

        .wave:nth-child(2) {
            animation-delay: 0.1s;
        }

        .wave:nth-child(3) {
            animation-delay: 0.2s;
        }

        @keyframes wave {

            0%,
            100% {
                transform: scaleY(0.5);
            }

            50% {
                transform: scaleY(1);
            }
        }

        .options {
            text-align: center;
            margin-bottom: 20px;
        }

        .transcription-container,
        .report-container,
        .raw-transcript-container {
            background-color: #ecf0f1;
            border-radius: 5px;
            padding: 20px;
            margin-top: 20px;
        }

        .transcription-container h2,
        .report-container h2,
        .raw-transcript-container h2 {
            color: #2c3e50;
            margin-top: 0;
        }

        #partialTranscript,
        #finalTranscript,
        #reportContent,
        #rawTranscript {
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        #partialTranscript {
            color: #7f8c8d;
        }

        #finalTranscript {
            color: #2c3e50;
        }

        #reportContent {
            font-family: monospace;
        }

        #rawTranscript {
            font-family: monospace;
            background-color: #f9f9f9;
            padding: 10px;
            border-radius: 5px;
        }

        .yaml-key {
            color: #2980b9;
        }

        .yaml-value {
            color: #27ae60;
        }

        .transcription-container,
        .report-container,
        .raw-transcript-container {
            background-color: #ecf0f1;
            border-radius: 5px;
            padding: 20px;
            margin-top: 20px;
            max-height: 300px;
            overflow-y: scroll;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .transcription-container::-webkit-scrollbar,
        .report-container::-webkit-scrollbar,
        .raw-transcript-container::-webkit-scrollbar {
            display: none;
        }

        #partialTranscript,
        #finalTranscript,
        #reportContent,
        #rawTranscript {
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 250px;
            overflow-y: scroll;
        }

        #partialTranscript::-webkit-scrollbar,
        #finalTranscript::-webkit-scrollbar,
        #reportContent::-webkit-scrollbar,
        #rawTranscript::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>AI-Patient Conversation Recorder</h1>
        <div class="controls">
            <button id="startBtn">Start Conversation</button>
            <button id="stopBtn" disabled>End Conversation</button>
            <button id="generateReportBtn" disabled>Generate Report</button>
        </div>
        <div id="status">Status: Not recording</div>
        <div class="wave-container">
            <div class="wave"></div>
            <div class="wave"></div>
            <div class="wave"></div>
        </div>
        <div class="options">
            <label>
                <input type="checkbox" id="rawTranscriptCheckbox">
                Show Raw Transcript
            </label>
        </div>
        <div class="transcription-container">
            <h2>Live Transcription</h2>
            <div id="partialTranscript"></div>
            <div id="finalTranscript"></div>
        </div>
        <div class="report-container">
            <h2>Generated Report</h2>
            <div id="reportContent"></div>
        </div>
        <div class="raw-transcript-container">
            <h2>Raw Transcript</h2>
            <div id="rawTranscript"></div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <script>
        let audioContext;
        let mediaStream;
        let recorder;
        let websocket;
        let audioChunks = [];
        let audioQueue = [];

        const SAMPLE_RATE = 16000;
        const BUFFER_SIZE = 4096;

        document.addEventListener('DOMContentLoaded', () => {
            const startBtn = document.getElementById('startBtn');
            const stopBtn = document.getElementById('stopBtn');
            const generateReportBtn = document.getElementById('generateReportBtn');
            const statusDiv = document.getElementById('status');
            const waveContainer = document.querySelector('.wave-container');
            const partialTranscriptDiv = document.getElementById('partialTranscript');
            const finalTranscriptDiv = document.getElementById('finalTranscript');
            const reportContentDiv = document.getElementById('reportContent');
            const rawTranscriptDiv = document.getElementById('rawTranscript');
            const rawTranscriptCheckbox = document.getElementById('rawTranscriptCheckbox');

            startBtn.addEventListener('click', startRecording);
            stopBtn.addEventListener('click', stopRecording);
            generateReportBtn.addEventListener('click', generateReport);

            async function startRecording() {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    alert('getUserMedia is not supported in your browser');
                    return;
                }

                try {
                    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: SAMPLE_RATE });
                    const source = audioContext.createMediaStreamSource(mediaStream);

                    recorder = audioContext.createScriptProcessor(BUFFER_SIZE, 1, 1);
                    source.connect(recorder);
                    recorder.connect(audioContext.destination);

                    const threadId = Math.random().toString(36).substring(7);
                    const patientId = '3229611d-9e1a-4030-afb7-49dde7b3da2e';
                    websocket = new WebSocket(`ws://localhost:8000/ws/chat/${threadId}/${patientId}`);

                    websocket.onopen = () => {
                        statusDiv.textContent = 'WebSocket connected';
                        startRecordingUI();
                    };

                    websocket.onclose = () => {
                        statusDiv.textContent = 'WebSocket disconnected';
                    };

                    websocket.onerror = (error) => {
                        console.error('WebSocket error:', error);
                        statusDiv.textContent = 'WebSocket error';
                    };

                    websocket.onmessage = (event) => {
                        if (typeof event.data === 'string') {
                            const data = JSON.parse(event.data);
                            if (data.type === 'partial_transcript') {
                                partialTranscriptDiv.textContent = data.text;
                            } else if (data.type === 'final_transcript') {
                                finalTranscriptDiv.innerHTML += data.text + '<br>';
                                partialTranscriptDiv.textContent = '';
                            } else if (data.type === 'ai_response') {
                                finalTranscriptDiv.innerHTML += `AI: ${data.text}<br>`;
                            }
                        } else if (event.data instanceof Blob) {
                            const reader = new FileReader();

                            // Read the Blob as an ArrayBuffer
                            reader.onload = function () {
                                const arrayBuffer = reader.result;
                                playAudio(arrayBuffer);
                            };

                            // Read the blob
                            reader.readAsArrayBuffer(event.data);
                        }
                    };

                    recorder.onaudioprocess = (e) => {
                        const inputData = e.inputBuffer.getChannelData(0);
                        const int16Array = new Int16Array(inputData.length);
                        for (let i = 0; i < inputData.length; i++) {
                            int16Array[i] = Math.max(-32768, Math.min(32767, Math.round(inputData[i] * 32767)));
                        }
                        audioChunks.push(int16Array);

                        if (websocket.readyState === WebSocket.OPEN) {
                            websocket.send(int16Array.buffer);
                        }
                    };

                } catch (err) {
                    console.error('Error accessing the microphone', err);
                    alert('Error accessing the microphone: ' + err.message);
                }
            }

            function startRecordingUI() {
                audioChunks = [];
                statusDiv.textContent = 'Recording started...';
                statusDiv.style.color = '#007bff';
                startBtn.disabled = true;
                stopBtn.disabled = false;
                generateReportBtn.disabled = true;
                waveContainer.style.display = 'flex';
                partialTranscriptDiv.textContent = '';
                finalTranscriptDiv.innerHTML = '';
                reportContentDiv.innerHTML = '';
                rawTranscriptDiv.innerHTML = '';
            }

            function stopRecording() {
                if (recorder) {
                    recorder.disconnect();
                }
                if (mediaStream) {
                    mediaStream.getTracks().forEach(track => track.stop());
                }
                if (websocket && websocket.readyState === WebSocket.OPEN) {
                    websocket.close();
                }

                statusDiv.textContent = 'Recording stopped';
                statusDiv.style.color = '#333';
                startBtn.disabled = false;
                stopBtn.disabled = true;
                generateReportBtn.disabled = false;
                waveContainer.style.display = 'none';

                // Create and download WAV file
                const wavBlob = createWavBlob(audioChunks);
                const audioUrl = URL.createObjectURL(wavBlob);
                const link = document.createElement('a');
                link.href = audioUrl;
                link.download = 'recording.wav';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }

            function getTranscript() {
                return finalTranscriptDiv.innerText;
            }

            function updateReportContent(content, isFinal = false) {
                if (isFinal) {
                    try {
                        const jsonContent = JSON.parse(content);
                        const yamlContent = jsyaml.dump(jsonContent);
                        reportContentDiv.innerHTML = highlightYaml(yamlContent);
                    } catch (e) {
                        console.error('Error parsing final report content:', e);
                        reportContentDiv.textContent = content;
                    }
                } else {
                    reportContentDiv.textContent = content;
                }
            }

            async function generateReport() {
                const transcript = getTranscript();
                if (!transcript) {
                    alert('No transcript available. Please record a conversation first.');
                    return;
                }

                const formData = new FormData();
                formData.append('transcript', transcript);
                formData.append('return_raw', rawTranscriptCheckbox.checked);

                try {
                    const response = await fetch('/report', {
                        method: 'POST',
                        body: formData,
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();

                    let reportContent = '';
                    let rawTranscript = '';
                    let buffer = '';

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        buffer += decoder.decode(value, { stream: true });

                        let newlineIndex;
                        while ((newlineIndex = buffer.indexOf('\n')) !== -1) {
                            const jsonString = buffer.slice(0, newlineIndex);
                            buffer = buffer.slice(newlineIndex + 1);

                            try {
                                const data = JSON.parse(jsonString);
                                if (data.stream !== undefined) {
                                    reportContent += data.stream;
                                    updateReportContent(reportContent);
                                } else if (data.raw_transcript !== undefined) {
                                    rawTranscript = data.raw_transcript;
                                    updateRawTranscript(rawTranscript);
                                }
                            } catch (e) {
                                console.error('Error parsing JSON:', e);
                            }
                        }
                    }

                    // Final update after streaming is complete
                    updateReportContent(reportContent, true);

                } catch (error) {
                    console.error('Error generating report:', error);
                    alert('Error generating report: ' + error.message);
                }
            }

            function updateRawTranscript(content) {
                if (content) {
                    try {
                        const jsonContent = typeof content === 'object' ? content : JSON.parse(content);
                        const transcript = jsonContent.transcript;
                        const lines = transcript.split('\n');
                        const formattedLines = lines.map(line => {
                            if (line.startsWith('doctor:')) {
                                return `<span style="color: blue;">${capitalizeFirstLetter('doctor:')}</span>${capitalizeFirstLetter(line.slice(7))}`;
                            } else if (line.startsWith('patient:')) {
                                return `<span style="color: green;">${capitalizeFirstLetter('patient:')}</span>${capitalizeFirstLetter(line.slice(8))}`;
                            } else {
                                return capitalizeFirstLetter(line);
                            }
                        });
                        const formattedTranscript = formattedLines.join('<br>');
                        rawTranscriptDiv.innerHTML = formattedTranscript;
                    } catch (e) {
                        console.error('Error parsing raw transcript:', e);
                        rawTranscriptDiv.textContent = typeof content === 'string' ? content : JSON.stringify(content, null, 2);
                    }
                }
            }

            function capitalizeFirstLetter(string) {
                return string.charAt(0).toUpperCase() + string.slice(1);
            }

            function removeEmptyFields(obj) {
                if (typeof obj !== 'object' || obj === null) {
                    return obj;
                }

                if (Array.isArray(obj)) {
                    return obj.map(removeEmptyFields).filter(item =>
                        item !== null &&
                        item !== undefined &&
                        item !== '' &&
                        (typeof item !== 'object' || Object.keys(item).length > 0)
                    );
                }

                const result = {};
                for (const [key, value] of Object.entries(obj)) {
                    const cleanValue = removeEmptyFields(value);
                    if (cleanValue !== null &&
                        cleanValue !== undefined &&
                        cleanValue !== '' &&
                        (typeof cleanValue !== 'object' || Object.keys(cleanValue).length > 0)) {
                        result[key] = cleanValue;
                    }
                }

                return result;
            }

            function highlightYaml(yaml) {
                return yaml.replace(/^(\s*)([^:\s]+):/gm, '$1<span class="yaml-key">$2</span>:')
                    .replace(/: (.+)$/gm, ': <span class="yaml-value">$1</span>');
            }

            function createWavBlob(audioChunks) {
                const wavHeader = createWavHeader(audioChunks.length * 2);
                const audioData = new Uint8Array(wavHeader.length + audioChunks.length * 2);
                audioData.set(new Uint8Array(wavHeader), 0);
                let offset = wavHeader.length;
                for (let chunk of audioChunks) {
                    audioData.set(new Uint8Array(chunk.buffer), offset);
                    offset += chunk.length * 2;
                }
                return new Blob([audioData], { type: 'audio/wav' });
            }

            function createWavHeader(dataLength) {
                const buffer = new ArrayBuffer(44);
                const view = new DataView(buffer);

                writeString(view, 0, 'RIFF');
                view.setUint32(4, 36 + dataLength, true);
                writeString(view, 8, 'WAVE');
                writeString(view, 12, 'fmt ');
                view.setUint32(16, 16, true);
                view.setUint16(20, 1, true);
                view.setUint16(22, 1, true);
                view.setUint32(24, SAMPLE_RATE, true);
                view.setUint32(28, SAMPLE_RATE * 2, true);
                view.setUint16(32, 2, true);
                view.setUint16(34, 16, true);
                writeString(view, 36, 'data');
                view.setUint32(40, dataLength, true);

                return buffer;
            }

            function writeString(view, offset, string) {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            }

            function generateUUID() {
                return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
                    var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                    return v.toString(16);
                });
            }

            function playAudio(arrayBuffer) {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                audioContext.decodeAudioData(arrayBuffer, (buffer) => {
                    const source = audioContext.createBufferSource();
                    source.buffer = buffer;
                    source.connect(audioContext.destination);
                    source.start(0);
                }, (error) => {
                    console.error('Error decoding audio data:', error);
                });
            }
        });
    </script>
</body>

</html>
